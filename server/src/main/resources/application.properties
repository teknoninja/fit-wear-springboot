# ==============================================================
# SPRING BOOT SERVER CONFIGURATION
# ==============================================================
server.port=8080

# ==============================================================
# SUPABASE POSTGRESQL DATABASE CONNECTION
# ==============================================================
# Replace the URL, username, and password with your Supabase credentials.
# You can find these in your Supabase Dashboard -> Project Settings -> Database -> Connection string (URI)
spring.datasource.url=jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres
spring.datasource.username=springboot.mwujewuqddkwoppdirbz
spring.datasource.password=Shivam@20030905
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================================================
# HIBERNATE / JPA CONFIGURATION
# ==============================================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CRITICAL: 'validate' ensures Spring Boot NEVER creates, drops, or alters 
# your live Supabase tables. It will only verify that your Java classes match the existing database.
spring.jpa.hibernate.ddl-auto=validate

# Initialize schema.sql if needed (disabled because springboot user does not have CREATE TABLE permissions)
spring.sql.init.mode=never

